<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内部插件市场 · 安装</title>
<link rel="stylesheet" href="/dsh-market/assets/market.css" />
</head>
<body>
<div class="chromebar" aria-hidden="true"></div>
<div class="chromebar-controls" aria-hidden="true"></div>
<header>
  <h1>内部插件市场</h1>
  <span class="who" id="who"></span>
  <button class="btn hidden" id="refresh">刷新目录</button>
  <button class="btn hidden" id="logout">退出</button>
</header>

<main class="wrap">
  <section id="view-noService" class="auth hidden">
    <h2>未配置市场服务端</h2>
    <div class="hint">这个页面是市场的<strong>客户端</strong>：账号、权限、插件目录都在独立的市场服务端，
      本机只负责把授权过的插件装进当前 profile。</div>
    <div class="hint">
      在启动 DSH 的环境里设置 <code>MARKET_SERVICE_URL</code>，例如：<br />
      <code>MARKET_SERVICE_URL=http://10.0.0.5:8787</code><br /><br />
      然后重启 DSH。启动服务端见项目 <code>README.md</code> §0。
    </div>
    <button class="btn" id="noService-retry">重新检测</button>
  </section>

  <section id="view-login" class="auth hidden">
    <h2>登录</h2>
    <div class="hint">账号由管理员在服务端控制台创建，没有自助注册。首次登录后必须修改初始密码。</div>
    <label>用户名<input type="text" id="login-user" autocomplete="username" /></label>
    <label>密码<input type="password" id="login-pass" autocomplete="current-password" /></label>
    <button class="btn btn-primary" id="login-submit">登录</button>
    <div class="err" id="login-err"></div>
    <div class="hint" id="login-service"></div>
  </section>

  <section id="view-password" class="auth hidden">
    <h2>设置新密码</h2>
    <div class="hint">首次登录（或管理员重置后）的强制步骤：改密前无法浏览或安装插件。至少 12 位。</div>
    <label>新密码<input type="password" id="pw-next" autocomplete="new-password" /></label>
    <label>确认新密码<input type="password" id="pw-next2" autocomplete="new-password" /></label>
    <button class="btn btn-primary" id="pw-submit">设置并继续</button>
    <div class="err" id="pw-err"></div>
  </section>

  <!--
    This page installs and uninstalls, and nothing else.

    Accounts, groups, plugin rules, publishing and artifact state are administration,
    and they live in the server console (`/console`). Showing them here meant every
    user saw a 权限管理 tab they could not use, and an administrator doing policy work
    had to navigate a plugin catalog to reach it. The service still owns every
    decision — this page cannot grant itself anything.
  -->
  <section id="view-market" class="hidden">
    <div class="note" id="note">加载中…</div>
    <div class="bar">
      <input type="search" id="query" placeholder="搜索插件名 / 摘要 / 归属团队" />
      <span class="meta" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
  </section>
</main>

<script src="/dsh-market/assets/shared.js"></script>
<script>
const S = globalThis.MarketShell
const { $, state, service, local, show, status, setWho, tag } = S

let catalog = null
const installedMap = new Map()

// ---------------------------------------------------------------------- 渲染

function renderNote() {
  const consoleUrl = `${String(state.serviceUrl ?? '').replace(/\/+$/, '')}/console`
  $('note').textContent =
    `服务端：${state.serviceUrl}\n` +
    `已登录：${catalog.user?.displayName ?? catalog.user?.username}　权限组：${(catalog.groups || []).join('、') || '无组'}\n` +
    `本机 profile：${state.profileDir ?? '(未知)'}\n` +
    '只显示你的权限组被授权的条目（默认拒绝，deny 优先）。下载与判定在服务端，落盘在本机。\n' +
    `账号、权限、发布由管理员在服务端控制台处理：${consoleUrl}`
}

function cardOf(entry) {
  const card = document.createElement('div')
  card.className = 'card'

  const name = document.createElement('div')
  name.className = 'name'
  name.textContent = entry.name
  card.appendChild(name)

  const sum = document.createElement('div')
  sum.className = 'sum'
  sum.textContent = entry.summary || '（无摘要）'
  card.appendChild(sum)

  const installedHere = installedMap.get(entry.name)

  const meta = document.createElement('div')
  meta.className = 'meta'
  meta.appendChild(document.createTextNode('v' + (entry.version || '?')))
  if (entry.channel) meta.appendChild(tag(entry.channel))
  if (entry.owner) meta.appendChild(tag(entry.owner))
  if (entry.status === 'revoked') meta.appendChild(tag('已撤回', 'tag-error'))
  else if (entry.status === 'published') meta.appendChild(tag('正常', 'tag-ok'))
  else meta.appendChild(tag(entry.status || '未知', 'tag-warn'))
  if (installedHere) meta.appendChild(tag('已安装到本机', 'tag-ok'))
  card.appendChild(meta)

  const dsh = document.createElement('div')
  dsh.className = 'meta'
  dsh.textContent =
    'DSH ' + (entry.dsh || '未声明') +
    (installedHere?.version ? `　本机版本 ${installedHere.version}` : '')
  card.appendChild(dsh)

  if (!entry.canInstall && entry.reason) {
    const reason = document.createElement('div')
    reason.className = 'meta'
    reason.appendChild(tag(entry.reason, 'tag-error'))
    card.appendChild(reason)
  }

  const actions = document.createElement('div')
  actions.className = 'actions'

  // The card IS the install state: an installed plugin offers 卸载, the rest offer
  // 安装. There is no separate "installed" list to cross-check.
  if (installedHere) {
    const uninstall = document.createElement('button')
    uninstall.className = 'btn btn-danger'
    uninstall.textContent = '卸载'
    uninstall.addEventListener('click', () => doUninstall(entry, uninstall))
    actions.appendChild(uninstall)

    if (entry.version && installedHere.version !== entry.version) {
      const update = document.createElement('button')
      update.className = 'btn btn-primary'
      update.textContent = `更新到 ${entry.version}`
      update.addEventListener('click', () => doInstall(entry, update))
      actions.appendChild(update)
    }
  } else if (entry.canInstall) {
    const install = document.createElement('button')
    install.className = 'btn btn-primary'
    install.textContent = '安装'
    install.addEventListener('click', () => doInstall(entry, install))
    actions.appendChild(install)
  } else {
    const blocked = document.createElement('button')
    blocked.className = 'btn'
    blocked.textContent = '不可安装'
    blocked.disabled = true
    actions.appendChild(blocked)
  }

  card.appendChild(actions)
  return card
}

function renderGrid() {
  const grid = $('grid')
  const query = $('query').value.trim().toLowerCase()
  grid.textContent = ''
  const entries = (catalog?.entries ?? []).filter((entry) => {
    if (!query) return true
    return [entry.name, entry.summary, entry.owner].some(
      (value) => typeof value === 'string' && value.toLowerCase().includes(query),
    )
  })
  $('count').textContent = `${entries.length} / ${(catalog?.entries ?? []).length} 个条目`
  if (entries.length === 0) {
    const empty = document.createElement('div')
    empty.className = 'empty'
    empty.textContent = (catalog?.entries ?? []).length === 0
      ? '没有可用条目。可能是你的权限组还没有被授予任何插件规则，请联系管理员。'
      : '没有匹配的条目。'
    grid.appendChild(empty)
    return
  }
  for (const entry of entries) grid.appendChild(cardOf(entry))
}

// ------------------------------------------------------------------ 加载数据

async function loadInstalled() {
  installedMap.clear()
  try {
    const result = await local('/dsh-market/installed')
    for (const item of result.body?.installed ?? []) installedMap.set(item.name, item)
  } catch { /* the catalog still renders; install buttons just cannot tell state */ }
}

async function loadCatalog() {
  status('')
  $('note').textContent = '加载中…'
  try {
    const result = await service('/dsh-market/catalog')
    if (!result.ok) {
      $('note').textContent = result.body?.detail || result.body?.code || `加载失败（HTTP ${result.status}）`
      return
    }
    catalog = result.body
    renderNote()
    renderGrid()
  } catch { /* request() switched views */ }
}

async function doInstall(entry, button) {
  button.disabled = true
  const label = button.textContent
  button.textContent = '安装中…'
  try {
    const result = await local('/dsh-market/install', {
      method: 'POST',
      body: {
        token: S.token.get(),
        name: entry.name,
        version: entry.version,
        sha256: entry.sha256,
        channel: entry.channel,
      },
    })
    if (!result.ok) {
      status(`安装失败：${result.body?.detail || result.body?.code}`, true)
      return
    }
    status(result.body?.needRestart
      ? `已安装 ${entry.name}。重启 DSH 后生效。`
      : `已安装 ${entry.name}。`)
    await loadInstalled()
    renderGrid()
  } catch (error) {
    status(`安装失败：${error?.message ?? error}`, true)
  } finally {
    button.disabled = false
    button.textContent = label
  }
}

async function doUninstall(entry, button) {
  button.disabled = true
  const label = button.textContent
  button.textContent = '卸载中…'
  try {
    const result = await local('/dsh-market/uninstall', { method: 'POST', body: { name: entry.name } })
    if (!result.ok) {
      status(`卸载失败：${result.body?.detail || result.body?.code}`, true)
      return
    }
    status(`已卸载 ${entry.name}。重启 DSH 后生效。`)
    await loadInstalled()
    renderGrid()
  } catch (error) {
    status(`卸载失败：${error?.message ?? error}`, true)
  } finally {
    button.disabled = false
    button.textContent = label
  }
}

// ------------------------------------------------------------------ 装配

S.onAuthenticated(async () => {
  setWho(state.me?.displayName ?? state.me?.username ?? '')
  $('login-service').textContent = `服务端：${state.serviceUrl}`
  await loadCatalog()
  await loadInstalled()
  renderGrid()
  show('market')
})

$('login-submit').addEventListener('click', S.doLogin)
$('login-pass').addEventListener('keydown', (event) => { if (event.key === 'Enter') S.doLogin() })
$('pw-submit').addEventListener('click', S.doChangePassword)
$('logout').addEventListener('click', S.doLogout)
$('refresh').addEventListener('click', () => { loadCatalog().then(() => loadInstalled().then(renderGrid)) })
$('query').addEventListener('input', () => { if (catalog) renderGrid() })
$('noService-retry').addEventListener('click', () => location.reload())

S.init({
  views: ['noService', 'login', 'password', 'market'],
  onView: (view) => {
    $('refresh').classList.toggle('hidden', view !== 'market')
    $('logout').classList.toggle('hidden', view !== 'market')
  },
  onLogout: () => {
    catalog = null
    $('grid').textContent = ''
    $('note').textContent = ''
  },
})
</script>
</body>
</html>
