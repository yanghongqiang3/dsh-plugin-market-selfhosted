<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内部插件市场 · 安装</title>
<link rel="stylesheet" href="/dsh-market/assets/market.css" />
</head>
<body>
<div class="chromebar" aria-hidden="true"></div>
<div class="chromebar-controls" aria-hidden="true"></div>
<header>
  <h1>内部插件市场</h1>
  <span class="who" id="who"></span>
  <button class="btn hidden" id="refresh">刷新目录</button>
  <button class="btn hidden" id="logout">退出</button>
</header>

<main class="wrap">
  <section id="view-noService" class="auth hidden">
    <h2>未配置市场服务端</h2>
    <div class="hint">这个页面是市场的<strong>客户端</strong>：账号、权限、插件目录都在独立的市场服务端，
      本机只负责把授权过的插件装进当前 profile。</div>
    <div class="hint">
      在启动 DSH 的环境里设置 <code>MARKET_SERVICE_URL</code>，例如：<br />
      <code>MARKET_SERVICE_URL=http://10.0.0.5:8787</code><br /><br />
      然后重启 DSH。启动服务端见项目 <code>README.md</code> §0。
    </div>
    <button class="btn" id="noService-retry">重新检测</button>
  </section>

  <section id="view-login" class="auth hidden">
    <h2>登录</h2>
    <div class="hint">账号由管理员在服务端控制台创建，没有自助注册。首次登录后必须修改初始密码。</div>
    <label>用户名<input type="text" id="login-user" autocomplete="username" /></label>
    <label>密码<input type="password" id="login-pass" autocomplete="current-password" /></label>
    <button class="btn btn-primary" id="login-submit">登录</button>
    <div class="err" id="login-err"></div>
    <div class="hint" id="login-service"></div>
  </section>

  <section id="view-password" class="auth hidden">
    <h2>设置新密码</h2>
    <div class="hint">首次登录（或管理员重置后）的强制步骤：改密前无法浏览或安装插件。至少 12 位。</div>
    <label>新密码<input type="password" id="pw-next" autocomplete="new-password" /></label>
    <label>确认新密码<input type="password" id="pw-next2" autocomplete="new-password" /></label>
    <button class="btn btn-primary" id="pw-submit">设置并继续</button>
    <div class="err" id="pw-err"></div>
  </section>

  <!--
    This page installs and uninstalls, and nothing else.

    Accounts, groups, plugin rules, publishing and artifact state are administration,
    and they live in the server console (`/console`). Showing them here meant every
    user saw a 权限管理 tab they could not use, and an administrator doing policy work
    had to navigate a plugin catalog to reach it. The service still owns every
    decision — this page cannot grant itself anything.
  -->
  <section id="view-market" class="hidden">
    <!--
      One compact line, with the rest folded away.

      This used to be six lines of prose above the cards — service URL, account, groups, DSH
      account, profile path, two paragraphs about how authorization works, and the console
      URL. On a laptop that is most of the visible area spent on text nobody reads twice, and
      it pushed the catalog itself below the fold.
    -->
    <div class="note" id="note">
      <span class="note-line" id="note-line">加载中…</span>
      <details class="note-more">
        <summary>说明</summary>
        <div class="note-detail" id="note-detail"></div>
      </details>
    </div>

    <!--
      DSH account binding, offered rather than performed.

      It is one-to-one and therefore scarce: binding on sign-in claimed a slot
      without asking, so logging into the wrong market account silently consumed a
      binding that then needed an administrator to release. The user clicks.
    -->
    <div class="bindbar" id="binding"></div>

    <div class="bar">
      <!--
        Three tabs over TWO stored buckets.

        A bundle counts as a plugin: it is a package the loader mounts, and the difference
        from a plain plugin is invisible to whoever is installing it. The counts come from
        the service rather than being computed here, so a tab label cannot drift from what
        its filter actually does.
      -->
      <div class="tabs" id="kind-tabs">
        <button class="tab is-on" data-kind="all">全部</button>
        <button class="tab" data-kind="plugin">插件</button>
        <button class="tab" data-kind="skill">技能</button>
      </div>
      <input type="search" id="query" placeholder="搜索名称 / 摘要 / 归属团队" />
      <span class="meta" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <!--
      Footer: feedback and paging, pinned below the scrolling grid.

      Both used to sit under the cards, so with a full page of results the pager was off
      screen — the one control you need precisely when the list is long.
    -->
    <footer class="market-foot">
      <div class="status" id="status"></div>
      <div class="pager" id="pager"></div>
    </footer>
  </section>
</main>

<script src="/dsh-market/assets/shared.js"></script>
<script>
const S = globalThis.MarketShell
const { $, state, service, local, show, status, setWho, tag } = S

let catalog = null
const installedMap = new Map()

/**
 * This machine's DSH account, as the host plugin reports it.
 *
 * `source` is one of `account` (a stable DSH account id is available), `device-only`
 * (signed in but no account id yet — the host's profile read did not happen or
 * failed) or `none` (not signed into DSH, or the service is absent). Only `account`
 * can be bound, because only it is a stable identity.
 */
let dshIdentity = { source: 'none', userId: null, name: null, deviceId: null, reason: null }
/** The binding the service reports for the signed-in market account. */
let binding = null
/**
 * Which tab is selected: `all` | `plugin` | `skill`.
 *
 * `plugin` is a BUCKET, not a stored kind — it covers `plugin` and `bundle`, because a
 * bundle is just a plugin package that also carries a patch layer. Two tabs over three
 * kinds is deliberate; see the catalog route.
 */
let activeKind = 'all'

/**
 * Server-side paging for the catalog.
 *
 * Created before first use because the tab handlers and the search box both call it. The
 * shell owns the arithmetic; this page only re-fetches whenever it says the page changed.
 */
const pagerCatalog = MarketShell.makePager({
  mount: 'pager',
  pageSize: 10,
  onChange: () => { void loadCatalog() },
})
/**
 * Whether THIS device holds a binding secret, i.e. whether auto-login is armed.
 *
 * Tracked separately from `binding` because the two can disagree: logging out clears the
 * secret but not the binding, and the row has to offer a way to arm it again.
 */
let linkStored = false

/**
 * Describe the DSH account this machine carries — and ONLY that.
 *
 * An earlier version of this function said 「（已绑定）」. That was wrong on two counts:
 * it described the MARKET binding while claiming to describe the DSH account, and it
 * was computed from the identity alone, so it announced a binding before anything had
 * asked the service. Whether a binding exists is `binding`'s job.
 */
function dshLabel() {
  if (dshIdentity.source === 'account') {
    return `DSH 账号：${dshIdentity.name ?? '(无显示名)'}　${dshIdentity.userId}`
  }
  if (dshIdentity.source === 'device-only') {
    return `DSH 账号未取得账号 ID：${dshIdentity.reason ?? '未知原因'}`
  }
  return `未检测到 DSH 账号：${dshIdentity.reason ?? '未知原因'}`
}

// ---------------------------------------------------------------------- 渲染

function renderNote() {
  const consoleUrl = `${String(state.serviceUrl ?? '').replace(/\/+$/, '')}/console`
  const bindLine = binding
    ? `DSH 账号：${binding.dshName || binding.dshUserId}（${binding.dshUserId}）`
    : `DSH 账号：${dshLabel()}`
  /**
   * One line on screen; everything else behind 「说明」.
   *
   * The visible line keeps only what changes how you read the list: which service, who you
   * are, and which groups your permissions come from. The paths, the DSH account and the
   * explanation of the authorization model are worth having and not worth the space — they
   * were six lines above the cards.
   */
  $('note-line').textContent =
    `服务端 ${state.serviceUrl ?? '(未知)'}　·　`
    + `${catalog?.user?.displayName ?? catalog?.user?.username ?? '(未登录)'}`
    + `　权限组 ${(catalog?.groups || []).join('、') || '无组'}`
  $('note-detail').textContent =
    `${bindLine}\n` +
    `本机 profile：${state.profileDir ?? '(未知)'}\n` +
    /**
     * This used to claim 「只显示你的权限组被授权的条目」, which is not what happens and never
     * was: the service lists EVERY artifact and annotates each with whether you may install
     * it, so a card you cannot install appears with its reason. That is deliberate — you
     * cannot ask for access to something you cannot see. The sentence was the defect; the
     * behaviour is asserted in test-server.mjs and probe-grant-flow.mjs.
     */
    '列出服务端的全部条目，每条标注你能否安装（默认拒绝，deny 优先）；不能装的会写明原因。\n' +
    '下载与判定在服务端，落盘在本机。\n' +
    `账号、权限、发布由管理员在服务端控制台处理：${consoleUrl}`
}

/** The compact line is also where load/error messages go. */
function setNote(text) {
  $('note-line').textContent = text
}

function cardOf(entry) {
  const card = document.createElement('div')
  card.className = 'card'

  const name = document.createElement('div')
  name.className = 'name'
  name.textContent = entry.name
  card.appendChild(name)

  const sum = document.createElement('div')
  sum.className = 'sum'
  sum.textContent = entry.summary || '（无摘要）'
  card.appendChild(sum)

  const installedHere = installedMap.get(entry.name)

  const meta = document.createElement('div')
  meta.className = 'meta'
  /**
   * Say WHAT it is, first, before version and owner.
   *
   * A skill and a plugin install completely differently — one is mounted by the loader, the
   * other is catalog instructions the agent reads — and the name alone does not always tell
   * you which. `plugin` also covers bundles, which is the same bucket the 插件 tab uses.
   */
  const kind = entry.kind ?? 'plugin'
  meta.appendChild(tag(kind === 'skill' ? '技能' : '插件', kind === 'skill' ? 'tag-kind-skill' : 'tag-kind-plugin'))
  meta.appendChild(document.createTextNode('v' + (entry.version || '?')))
  if (entry.channel) meta.appendChild(tag(entry.channel))
  if (entry.owner) meta.appendChild(tag(entry.owner))
  if (entry.status === 'revoked') meta.appendChild(tag('已撤回', 'tag-error'))
  else if (entry.status === 'published') meta.appendChild(tag('正常', 'tag-ok'))
  else meta.appendChild(tag(entry.status || '未知', 'tag-warn'))
  if (installedHere) meta.appendChild(tag('已安装到本机', 'tag-ok'))
  card.appendChild(meta)

  const dsh = document.createElement('div')
  dsh.className = 'meta'
  dsh.textContent =
    'DSH ' + (entry.dsh || '未声明') +
    (installedHere?.version ? `　本机版本 ${installedHere.version}` : '')
  card.appendChild(dsh)

  if (!entry.canInstall && entry.reason) {
    const reason = document.createElement('div')
    reason.className = 'meta'
    reason.appendChild(tag(entry.reason, 'tag-error'))
    card.appendChild(reason)
  }

  const actions = document.createElement('div')
  actions.className = 'actions'

  // The card IS the install state: an installed plugin offers 卸载, the rest offer
  // 安装. There is no separate "installed" list to cross-check.
  if (installedHere) {
    const uninstall = document.createElement('button')
    uninstall.className = 'btn btn-danger'
    uninstall.textContent = '卸载'
    uninstall.addEventListener('click', () => doUninstall(entry, uninstall))
    actions.appendChild(uninstall)

    /**
     * Offer an update only when the versions actually DIFFER — and only when the installed
     * version is known.
     *
     * The bug this fixes: skill entries reported `version: null` (the host plugin skipped
     * them when filling versions in, because a skill has no directory under `node_modules`),
     * so `null !== '1.0.0'` was true and an already-installed 1.0.0 was offered as
     * 「更新到 1.0.0」.
     *
     * The `installedHere.version &&` guard is the durable half: if the installed version is
     * ever unknown again, offering an update is the wrong guess, and saying nothing is the
     * right one.
     */
    if (entry.version && installedHere.version && entry.version !== installedHere.version) {
      const update = document.createElement('button')
      update.className = 'btn btn-primary'
      update.textContent = `更新到 ${entry.version}`
      update.addEventListener('click', () => doInstall(entry, update))
      actions.appendChild(update)
    }
  } else if (entry.canInstall) {
    const install = document.createElement('button')
    install.className = 'btn btn-primary'
    install.textContent = '安装'
    install.addEventListener('click', () => doInstall(entry, install))
    actions.appendChild(install)
  } else {
    const blocked = document.createElement('button')
    blocked.className = 'btn'
    blocked.textContent = '不可安装'
    blocked.disabled = true
    actions.appendChild(blocked)
  }

  card.appendChild(actions)
  return card
}

function renderGrid() {
  const grid = $('grid')
  grid.textContent = ''
  // The FILTERING is the service's now — see the catalog route. This used to filter
  // whatever had been loaded, which is only the same thing while everything arrives in one
  // response; with paging it would search the current page and report "no match" for
  // entries that are merely on another page.
  const entries = catalog?.entries ?? []
  const { total, counts } = { total: catalog?.total ?? 0, counts: catalog?.counts ?? {} }
  const tabs = { all: '全部', plugin: '插件', skill: '技能' }
  const q = $('query').value.trim()
  $('count').textContent = q === ''
    ? `${total} / ${counts.all ?? total} 个条目`
    : `${total} / ${counts.matched ?? total} 个匹配`
  for (const button of $('kind-tabs').children) {
    const kind = button.dataset.kind
    const n = counts[kind]
    button.textContent = typeof n === 'number' ? `${tabs[kind]} ${n}` : tabs[kind]
    button.classList.toggle('is-on', kind === activeKind)
  }
  if (entries.length === 0) {
    const empty = document.createElement('div')
    empty.className = 'empty'
    empty.textContent = (counts[kindOfActive()] ?? 0) === 0
      ? activeKind === 'skill'
        ? '还没有可用的技能。'
        : '没有可用条目。可能是你的权限组还没有被授予任何插件规则，请联系管理员。'
      : '没有匹配的条目。'
    grid.appendChild(empty)
    return
  }
  for (const entry of entries) grid.appendChild(cardOf(entry))
}

/** The bucket a tab maps to; `plugin` covers bundles too. */
function kindOfActive() {
  return activeKind
}

// ------------------------------------------------------------------ 加载数据

async function loadInstalled() {
  installedMap.clear()
  try {
    const result = await local('/dsh-market/installed')
    // The host plugin answers `{ entries: [...] }`, NOT `{ installed: [...] }`.
    // Reading the wrong key left this map permanently empty, so every plugin showed
    // as 未安装 even right after installing it here. Assert the shape rather than
    // silently defaulting to nothing.
    const list = result.body?.entries
    if (!Array.isArray(list)) {
      status(`读取本机已装列表失败：${result.body?.code ?? result.body?.detail ?? '响应缺少 entries'}`, true)
      return
    }
    for (const item of list) installedMap.set(item.name, item)
  } catch { /* the catalog still renders; install buttons just cannot tell state */ }
}

/**
 * Render the catalog only once the installed list is known.
 *
 * These used to run in the other order: the grid was drawn while `installedMap` was
 * still empty, so every card offered 安装 even for plugins already on this machine.
 * The second render hid it in the common path, which is exactly why the order is
 * asserted by the preflight rather than left implicit.
 */
async function refreshCatalog() {
  await loadInstalled()
  await loadCatalog()
}

async function loadCatalog() {
  status('')
  setNote('加载中…')
  try {
    // `params` is a GETTER on the pager object, not a method — the same shape the admin
    // console reads via `pager[listName].params.limit`.
    const params = new URLSearchParams({ kind: activeKind, ...pagerCatalog.params })
    const q = $('query').value.trim()
    if (q !== '') params.set('q', q)
    const result = await service(`/dsh-market/catalog?${params}`)
    if (!result.ok) {
      setNote(result.body?.detail || result.body?.code || `加载失败（HTTP ${result.status}）`)
      return
    }
    // The service reports the page, the total AND the tab counts, so the labels and the
    // pager come from one source of truth rather than being recomputed (and drifting) here.
    catalog = result.body
    pagerCatalog.setTotal(catalog.total ?? 0)
    renderNote()
    renderGrid()
  } catch { /* request() switched views */ }
}

/** Reload from the first page — for a tab switch or a new search. */
async function reloadCatalog() {
  pagerCatalog.reset()
  await loadCatalog()
}

async function doInstall(entry, button) {
  button.disabled = true
  const label = button.textContent
  button.textContent = '安装中…'
  try {
    const result = await local('/dsh-market/install', {
      method: 'POST',
      body: {
        token: S.token.get(),
        name: entry.name,
        version: entry.version,
        sha256: entry.sha256,
        channel: entry.channel,
      },
    })
    if (!result.ok) {
      status(`安装失败：${result.body?.detail || result.body?.code}`, true)
      return
    }
    status(result.body?.needRestart
      ? `已安装 ${entry.name}。重启 DSH 后生效。`
      : `已安装 ${entry.name}。`)
    await loadInstalled()
    renderGrid()
  } catch (error) {
    status(`安装失败：${error?.message ?? error}`, true)
  } finally {
    button.disabled = false
    button.textContent = label
  }
}

async function doUninstall(entry, button) {
  button.disabled = true
  const label = button.textContent
  button.textContent = '卸载中…'
  try {
    const result = await local('/dsh-market/uninstall', { method: 'POST', body: { name: entry.name } })
    if (!result.ok) {
      status(`卸载失败：${result.body?.detail || result.body?.code}`, true)
      return
    }
    status(`已卸载 ${entry.name}。重启 DSH 后生效。`)
    await loadInstalled()
    renderGrid()
  } catch (error) {
    status(`卸载失败：${error?.message ?? error}`, true)
  } finally {
    button.disabled = false
    button.textContent = label
  }
}

// ------------------------------------------------------------------ 身份绑定

/**
 * Ask the host plugin who this machine's DSH account is.
 *
 * Local, same-origin, and never fatal: any failure means "no identity", and the page
 * simply falls back to its own login.
 */
async function loadDshIdentity() {
  try {
    const result = await local('/dsh-market/identity')
    const body = result.body
    if (body && typeof body === 'object' && typeof body.source === 'string') {
      dshIdentity = {
        source: body.source,
        userId: body.userId ?? null,
        name: body.name ?? null,
        deviceId: body.deviceId ?? null,
        reason: body.reason ?? null,
      }
    }
  } catch (error) {
    dshIdentity = { source: 'none', userId: null, name: null, deviceId: null, reason: String(error?.message ?? error) }
  }
  return dshIdentity
}

/**
 * Bind this DSH account to the signed-in market account.
 *
 * MANUAL, by explicit click. Binding on sign-in was the first version and it was
 * wrong: it claimed a scarce slot — one DSH account to one market account — without
 * asking, and a user who logged into the wrong market account silently consumed a
 * binding that then needed an administrator to release.
 *
 * Before offering the button, `lookup` is asked whether this DSH account is already
 * taken. That is why the route exists: a clicked button that always fails on a taken
 * account is a worse experience than a button that already says so.
 *
 * A machine with no stable DSH account id is not an error: it just keeps using the
 * ordinary login, which is also the only option for someone not signed into DSH.
 */
async function bindIdentity() {
  if (dshIdentity.source !== 'account' || !dshIdentity.userId) return { skipped: true }
  const result = await service('/dsh-market/identity/bind', {
    method: 'POST',
    body: {
      dshUserId: dshIdentity.userId,
      dshName: dshIdentity.name ?? '',
      deviceId: dshIdentity.deviceId ?? null,
    },
  })
  if (result.ok) {
    binding = result.body?.binding ?? null
    await saveLinkSecret(result.body?.secret)
    return { ok: true, unchanged: result.body?.unchanged === true }
  }
  return { ok: false, code: result.body?.code, detail: result.body?.detail }
}

/**
 * Hand the binding secret to the DSH host plugin, which keeps it in the profile.
 *
 * It goes to the PLUGIN, not to localStorage: the plugin performs the exchange later, so
 * a script on this page never needs to hold the credential. The service returns it exactly
 * once — here.
 */
async function saveLinkSecret(secret) {
  if (!secret || !dshIdentity.userId) return
  try {
    await local('/dsh-market/link', {
      method: 'POST',
      body: { dshUserId: dshIdentity.userId, secret, marketUsername: state.me?.username ?? null },
    })
  } catch {
    // Not fatal: the binding stands, the user just does not get auto-login next time.
    status('已绑定，但本机未能保存自动登录凭据（下次仍需手动登录）。', true)
  }
}

/** Forget the local secret, so a released binding cannot be renewed. */
async function dropLinkSecret() {
  try {
    await local('/dsh-market/link', { method: 'POST', body: { clear: true } })
  } catch {
    /* the service side is already unbound; a stale local file is inert without it */
  }
}

/**
 * Ask the plugin for a session using the stored secret — this is the auto-login.
 *
 * The DSH account is signed in and bound, so the user should not have to type a market
 * password on this machine again. The PLUGIN does the exchange, so the credential never
 * reaches this page.
 */
async function tryAutoLogin() {
  if (dshIdentity.source !== 'account') return false
  let result
  try {
    result = await local('/dsh-market/session')
  } catch {
    return false
  }
  // Remembered so the binding row can offer to turn auto-login back ON after a logout.
  linkStored = result?.body?.hasSecret === true
  const session = result?.body?.session
  if (!result?.ok || !session?.token) return false
  S.token.set(session.token)
  // Same key shared.js uses; the refresh token must be stored here too or the session
  // would still expire after two hours.
  // `global` exists only as the IIFE parameter inside shared.js. At this script's top
  // level it is UNDEFINED, so `global.localStorage` threw — after the token was set and
  // BEFORE setMe, which is why auto-login broke on a machine that had a binding secret.
  if (session.refresh) globalThis.localStorage.setItem('dsh.market.refresh', session.refresh)
  if (session.user) S.setMe(session.user)
  return true
}

/** Ask the service whether this DSH account already holds a slot. */
async function lookupDshTaken() {
  if (dshIdentity.source !== 'account' || !dshIdentity.userId) return null
  try {
    const result = await service(`/dsh-market/identity/lookup?dshUserId=${encodeURIComponent(dshIdentity.userId)}`)
    // The answer is only ever a boolean; it never says who holds it.
    return result.ok ? Boolean(result.body?.bound) : null
  } catch {
    return null
  }
}

/**
 * Draw the binding line: current state, plus the button that changes it.
 *
 * Rebuilt from scratch each time so it cannot show a stale state after a bind, a
 * reload or a logout.
 */
async function renderBinding() {
  const box = $('binding')
  box.textContent = ''

  const line = document.createElement('div')
  line.className = 'meta'
  box.appendChild(line)

  const action = document.createElement('button')
  action.className = 'btn'
  box.appendChild(action)

  if (binding) {
    line.textContent = `已绑定 DSH 账号：${binding.dshName || '(无显示名)'}　${binding.dshUserId}`
    // Unbinding releases the user's OWN account link, so it is theirs to do. Requiring
    // an administrator turned a mistyped sign-in into a support ticket, and an
    // administrator hit the same wall: the button was disabled for everyone.
    action.textContent = '解绑'
    action.addEventListener('click', doUnbind)

    /**
     * After a logout this device no longer holds a secret, so auto-login is off while the
     * binding stands. Offer the way back explicitly rather than making the user unbind and
     * rebind to get it — and rather than re-arming it silently, which is the automatic
     * behaviour that was deliberately removed.
     */
    if (!linkStored) {
      line.textContent += '\n此设备已关闭自动登录（退出登录会关闭它）。'
      const arm = document.createElement('button')
      arm.className = 'btn'
      arm.textContent = '在此设备启用自动登录'
      arm.addEventListener('click', async () => {
        arm.disabled = true
        arm.textContent = '启用中…'
        const result = await bindIdentity()
        if (!result.ok) {
          reportBindFailure(result)
        } else {
          status('已在本设备启用自动登录。下次打开安装页将直接进入。')
        }
        await renderBinding()
      })
      box.appendChild(arm)
    }
    return
  }

  if (dshIdentity.source !== 'account') {
    line.textContent = `未绑定。${dshLabel()}`
    action.textContent = '绑定此 DSH 账号'
    action.disabled = true
    return
  }

  line.textContent = `未绑定。检测到 DSH 账号：${dshIdentity.name ?? '(无显示名)'}　${dshIdentity.userId}`
  action.textContent = '绑定此 DSH 账号'
  action.disabled = true

  const taken = await lookupDshTaken()
  if (taken === true) {
    line.textContent += '\n这个 DSH 账号已经绑定了别的市场账号（一个 DSH 账号只能绑一个）。'
    action.textContent = '该 DSH 账号已被占用'
    return
  }

  action.disabled = false
  if (taken === null) {
    // The lookup failed but the bind may still work; say so rather than hiding the
    // action behind a probe that is only a convenience.
    line.textContent += '\n（无法预先确认该 DSH 账号是否已被占用，绑定时会由服务端判定）'
  }
  action.addEventListener('click', doBind)
}

async function doBind() {
  const button = $('binding').querySelector('button')
  if (button) { button.disabled = true; button.textContent = '绑定中…' }
  const result = await bindIdentity()
  if (result.ok) {
    status(result.unchanged ? '这个 DSH 账号已经绑在你名下，无需重复绑定。' : '已绑定。')
  } else if (result.skipped) {
    status('这台机器没有可用的 DSH 账号 ID，无法绑定。', true)
  } else {
    reportBindFailure(result)
  }
  await renderBinding()
  if (catalog) renderNote()
}

/**
 * Release this user's own binding.
 *
 * The service route takes no identifier: it releases the binding that belongs to the
 * caller's token. So there is nothing to confirm here about WHICH binding — only
 * about doing it at all, and a confirmation is enough for an action that is
 * reversible by simply binding again.
 */
async function doUnbind() {
  const who = binding?.dshName || binding?.dshUserId || '当前 DSH 账号'
  if (!confirm(`解除绑定：${who}？\n\n解绑后可以重新绑定，或换绑到另一个账号。`)) return
  const button = $('binding').querySelector('button')
  if (button) { button.disabled = true; button.textContent = '解绑中…' }
  try {
    const result = await service('/dsh-market/identity/unbind', { method: 'POST' })
    if (!result.ok) {
      status(`解绑失败：${result.body?.detail || result.body?.code || '未知原因'}`, true)
    } else {
      // Drop the local secret too: leaving it would let the next page load silently sign
      // back in as an account that is no longer bound.
      await dropLinkSecret()
      status('已解绑。')
    }
  } catch (error) {
    status(`解绑失败：${error?.message ?? error}`, true)
  }
  // Re-read rather than assuming: the server is the authority on whether it took.
  try {
    const mine = await service('/dsh-market/identity/me')
    binding = mine.body?.binding ?? null
  } catch { /* keep the previous value; renderBinding will show it */ }
  await renderBinding()
  if (catalog) renderNote()
}

/** Report a binding conflict so the user knows which side to ask about. */
function reportBindFailure(failure) {
  if (failure.code === 'E_MARKET_ALREADY_BOUND') {
    status(
      '这个市场账号已经绑定了另一个 DSH 账号。一个市场账号只能绑一个 DSH 账号，'
      + '需要管理员在服务端控制台解绑后再试。',
      true,
    )
    return
  }
  if (failure.code === 'E_DSH_ALREADY_BOUND') {
    status(
      `这台机器的 DSH 账号已经绑定了市场账号「${failure.detail ?? '(未知)'}」。`
      + '一个 DSH 账号只能绑一个市场账号，请用那个账号登录，或让管理员先解绑。',
      true,
    )
    return
  }
  status(`身份绑定失败：${failure.detail ?? failure.code ?? '未知原因'}（仍可正常安装，只是未绑定）`, true)
}

// ------------------------------------------------------------------ 装配

S.onAuthenticated(async () => {
  setWho(state.me?.displayName ?? state.me?.username ?? '')
  // include the DSH label: the login hint already shows it, and overwriting with the
  // service URL alone would drop it.
  $('login-service').textContent = `服务端：${state.serviceUrl}\n${dshLabel()}`
  // NO automatic binding: signing in must not claim a one-to-one slot on the user's
  // behalf. The state is read and offered, and the user clicks.
  try {
    const mine = await service('/dsh-market/identity/me')
    binding = mine.body?.binding ?? null
  } catch {
    binding = null
  }
  // Installed state first, then the catalog: the grid decides each card's buttons
  // from `installedMap`, so drawing it before the list arrives offers 安装 for
  // plugins that are already here.
  await refreshCatalog()
  await renderBinding()
  show('market')
})

$('login-submit').addEventListener('click', S.doLogin)
$('login-pass').addEventListener('keydown', (event) => { if (event.key === 'Enter') S.doLogin() })
$('pw-submit').addEventListener('click', S.doChangePassword)
$('logout').addEventListener('click', S.doLogout)
$('refresh').addEventListener('click', () => { status(''); refreshCatalog() })
/**
 * A tab switch or a new search restarts at page 1.
 *
 * Keeping the old offset would show an empty page whenever the new result set is shorter —
 * the same trap the admin lists avoid by resetting on search.
 */
for (const button of $('kind-tabs').children) {
  button.addEventListener('click', async () => {
    if (button.dataset.kind === activeKind) return
    activeKind = button.dataset.kind
    await reloadCatalog()
  })
}
// Search goes to the SERVICE, debounced: it has to search the whole catalog, not the page
// currently on screen. 220ms matches the admin console so the two feel the same.
let searchTimer = null
$('query').addEventListener('input', () => {
  // Same mistake here: this threw on the first keystroke, so the debounced reload never
  // ran and searching did nothing at all — silently, with no error on screen.
  if (searchTimer !== null) globalThis.clearTimeout(searchTimer)
  searchTimer = globalThis.setTimeout(() => { void reloadCatalog() }, 220)
})
$('noService-retry').addEventListener('click', () => location.reload())

S.init({
  views: ['noService', 'login', 'password', 'market'],
  /**
   * Read the DSH identity first, then try auto-login.
   *
   * Order matters: auto-login needs the identity to decide whether this machine even has a
   * DSH account. Doing it in `beforeBoot` also means a returning user never sees the login
   * screen flash before being signed in.
   */
  beforeBoot: async () => {
    await loadDshIdentity()
    await tryAutoLogin()
  },
  onView: (view) => {
    $('refresh').classList.toggle('hidden', view !== 'market')
    $('logout').classList.toggle('hidden', view !== 'market')
    // Show which DSH account this machine carries on the LOGIN screen too, so the
    // user knows what will be bound before signing in.
    if (view === 'login') {
      $('login-service').textContent = `服务端：${state.serviceUrl}\n${dshLabel()}`
    }
  },
  onLogout: () => {
    catalog = null
    $('grid').textContent = ''
    setNote('')
    /**
     * Drop this device's binding secret.
     *
     * Without this the 退出 button was a lie: the session and the refresh token were
     * cleared, but the secret stayed — so the very next visit asked the plugin for a
     * session and silently signed the user back in.
     *
     * The BINDING is untouched. This only disarms auto-login on this machine, and the
     * binding row offers to arm it again.
     */
    linkStored = false
    void dropLinkSecret()
  },
})
</script>
</body>
</html>
