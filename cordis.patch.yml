# DSH bundle patch layer for dsh-plugin-market-selfhosted.
#
# How this layer is read (verified against dsh-app-boot's applyEntryPatches):
#
#  1. The top level MUST be an insert list (`- insert:` wrapping the rows).
#     A bare top-level row is read as an id-targeted override of an EXISTING
#     row, not an insertion — so the package would silently never enter the
#     composition.
#
#  2. A row's `id` is a short addressable name; `name` is what the loader imports.
#
#  3. A package listed in `dsh.profile.bundles` is NOT itself a loader row. Being
#     in `bundles` only means "apply this package's dsh.bundle.patch as a layer".
#     Rows exist because a patch inserts them — which is what the insert below
#     does. Copying files into node_modules mounts nothing on its own.
#
# There are TWO rows, and the difference in their `name` is load-bearing:
#
#   dsh-plugin-market-selfhosted/plugin   Host half. A host row may name a subpath.
#   dsh-plugin-market-selfhosted          Browser half. This MUST be the bare package
#                                   name: `dsh-client-modules` resolves a row's
#                                   package.json via `exactPackageSpecifier`,
#                                   which returns undefined for any specifier
#                                   containing "/", after which `locatePkgJson`
#                                   drops the row SILENTLY — no error, just no
#                                   client module.
#
# The browser half (`lib/client.js`) is a plain script, not a build output: it
# registers itself through `window.__ModuleLoader__.load({ id, factory })` with an
# id equal to the package name. See that file's header for the rules that decide
# whether it activates, and `dsh.client.inject` in package.json for the client-side
# ordering.
#
# On the empty host half in lib/bundle.js: keeping a bundle's own entry free of
# behaviour is a convention worth following, but it is NOT what the activation
# audit enforces. That audit only checks whether each row's fiber reached
# `active`, and a row whose `apply` ran is active whatever it did.

- insert:
    - id: marketplace
      name: dsh-plugin-market-selfhosted/plugin
    - id: marketplace-client
      name: dsh-plugin-market-selfhosted

# Verify after a DSH restart:
#   ~/.dsh/plugin-marketplace-diag.log records
#     [entry] registered webserver/index-inject rows (desktop + web shell)
#     [register] registered 7/7 routes
#   and the startup output must NOT contain
#     marketplace-client (dsh-plugin-market-selfhosted): failed to import
#   `plugin_manager` list_bundles should show this bundle with TWO rows.
