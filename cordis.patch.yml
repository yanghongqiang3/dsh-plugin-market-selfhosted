# DSH bundle patch layer for dsh-plugin-marketplace.
#
# How this layer is read (verified against dsh-app-boot's applyEntryPatches):
#
#  1. The top level MUST be an insert list (`- insert:` wrapping the rows).
#     A bare top-level row is read as an id-targeted override of an EXISTING
#     row, not an insertion — so the package would silently never enter the
#     composition.
#
#  2. A row's `id` is a short addressable name; `name` is what the loader imports.
#
#  3. A package listed in `dsh.profile.bundles` is NOT itself a loader row. Being
#     in `bundles` only means "apply this package's dsh.bundle.patch as a layer".
#     Rows exist because a patch inserts them — which is what the insert below
#     does. Copying files into node_modules mounts nothing on its own.
#
# ONE row, deliberately. A browser half (`dsh.client`) needs a SECOND row whose
# `name` is the BARE package name, because `dsh-client-modules` resolves a row's
# package.json through `exactPackageSpecifier`, which returns undefined for any
# specifier containing "/" — after which `locatePkgJson` drops the row SILENTLY.
#
# That route is written but DISABLED. lib/client.js is a complete client module
# (plain script, react from the platform seed, registrations for
# `sidebar.panellist` and `sidebar.footer.action`). It was enabled and tested:
#
#   - both rows' modules imported successfully, proven with an import probe
#     (`[bundle] bare-name entry imported`, `[probe] plugin.js imported`, and
#     `apply` ran, registering 6/6 routes);
#   - yet the browser's boot graph (`__DSH_BOOT__.entries`) never received
#     `dsh-plugin-marketplace`, and the host audit reported
#     `marketplace-client (dsh-plugin-marketplace): failed to import`;
#   - a structurally identical control package (`dsh-client-smoke`, same
#     directory, same manifest shape, no `dependencies` entry) activated fine.
#
# Until that difference is explained, enabling the row would put a
# `warning: 1 entry did not activate` on every launch. The in-app entry is
# injected through `webserver/index-inject` instead (README §4.1).
#
# To re-enable: restore `dsh.client` in package.json, restore the `./client`
# export, and add `- id: marketplace-client` / `name: dsh-plugin-marketplace`.

- insert:
    - id: marketplace
      name: dsh-plugin-marketplace/plugin

# Verify after a DSH restart: ~/.dsh/plugin-marketplace-diag.log should record
#   [entry] registered webserver/index-inject rows (desktop + web shell)
#   [register] registered 6/6 routes
