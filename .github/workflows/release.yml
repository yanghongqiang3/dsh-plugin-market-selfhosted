name: release

# On a v* tag, build the installable client tarball and attach it to the
# GitHub Release. The asset name deliberately carries no version: the stable
# https://github.com/<owner>/<repo>/releases/latest/download/dsh-plugin-market-internal.tgz
# link then keeps working across releases (the community marketplace's
# `tarball:` field relies on that).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the client tarball
        run: node tools/pack-dist.mjs
      - name: Use a version-free asset name
        run: mv dist/*.tgz dsh-plugin-market-internal.tgz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dsh-plugin-market-internal.tgz --generate-notes
